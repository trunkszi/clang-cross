# shellcheck shell=bash
# Recipe variables are consumed by scripts/dependencies.sh.
# shellcheck disable=SC2034
# Declarative dependency recipe for amazonlinux2; setup runs only in scripts/make.
PKG_MANAGER=yum
MIRROR_SETUP_COMMANDS=()
EXTRA_SETUP_COMMANDS=(amazonlinux_compiler)
PACKAGES=(
    ca-certificates
    curl
    diffutils
    file
    git
    make
    patch
    pkgconfig
    python3
    python3-pip
    tar
    util-linux
    unzip
    wget
    which
    xz
    zlib-devel
    gcc10
    gcc10-c++
    gcc10-binutils
)
