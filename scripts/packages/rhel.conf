# shellcheck shell=bash
# Recipe variables are consumed by scripts/dependencies.sh.
# shellcheck disable=SC2034
# Declarative dependency recipe for rhel; setup runs only in scripts/make.
PKG_MANAGER=rpm-auto
MIRROR_SETUP_COMMANDS=()
EXTRA_SETUP_COMMANDS=(ensure_cmake)
PACKAGES=(
    ca-certificates
    cmake
    curl
    diffutils
    file
    gcc
    gcc-c++
    git
    make
    ninja-build
    patch
    pkgconfig
    python3
    unzip
    wget
    which
    xz
    zlib-devel
    python3-pip
    util-linux
)
