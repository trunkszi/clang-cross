# shellcheck shell=bash
# Recipe variables are consumed by scripts/dependencies.sh.
# shellcheck disable=SC2034
# Declarative dependency recipe for centos7; setup runs only in scripts/make.
PKG_MANAGER=yum
MIRROR_SETUP_COMMANDS=(centos_mirrors)
EXTRA_SETUP_COMMANDS=(centos_compiler)
PACKAGES=(
    ca-certificates
    curl
    diffutils
    file
    git
    make
    patch
    pkgconfig
    python3
    python3-pip
    tar
    util-linux
    unzip
    wget
    which
    xz
    zlib-devel
    devtoolset-11-gcc
    devtoolset-11-gcc-c++
    devtoolset-11-binutils
)
