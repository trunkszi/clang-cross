# shellcheck shell=bash
# Recipe variables are consumed by scripts/dependencies.sh.
# shellcheck disable=SC2034
# Declarative dependency recipe for arch; setup runs only in scripts/make.
PKG_MANAGER=pacman
MIRROR_SETUP_COMMANDS=()
EXTRA_SETUP_COMMANDS=()
PACKAGES=(
    base-devel
    ca-certificates
    cmake
    curl
    file
    gcc
    git
    make
    ninja
    patch
    pkgconf
    python
    unzip
    wget
    which
    xz
    zlib
    util-linux
)
