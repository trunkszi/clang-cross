# shellcheck shell=bash
# Recipe variables are consumed by scripts/dependencies.sh.
# shellcheck disable=SC2034
# Declarative dependency recipe for alpine; setup runs only in scripts/make.
PKG_MANAGER=apk
MIRROR_SETUP_COMMANDS=()
EXTRA_SETUP_COMMANDS=()
PACKAGES=(
    build-base
    ca-certificates
    cmake
    curl
    file
    g++
    gcc
    git
    make
    ninja
    patch
    pkgconf
    python3
    unzip
    wget
    xz
    zlib-dev
    linux-headers
    musl-dev
    util-linux
)
