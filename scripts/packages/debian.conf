# shellcheck shell=bash
# Recipe variables are consumed by scripts/dependencies.sh.
# shellcheck disable=SC2034
# Declarative dependency recipe for debian; setup runs only in scripts/make.
PKG_MANAGER=apt-get
MIRROR_SETUP_COMMANDS=()
EXTRA_SETUP_COMMANDS=()
PACKAGES=(
    build-essential
    ca-certificates
    cmake
    curl
    file
    g++
    git
    libz-dev
    make
    ninja-build
    patch
    pkg-config
    python3
    unzip
    wget
    xz-utils
    util-linux
    diffutils
)
