# shellcheck shell=bash
# Recipe variables are consumed by scripts/dependencies.sh.
# shellcheck disable=SC2034
# Declarative dependency recipe for alinux3; setup runs only in scripts/make.
PKG_MANAGER=dnf
MIRROR_SETUP_COMMANDS=()
EXTRA_SETUP_COMMANDS=(alinux_python)
PACKAGES=(
    ca-certificates
    cmake
    curl
    diffutils
    file
    gcc
    gcc-c++
    git
    make
    ninja-build
    patch
    pkgconfig
    python3.11
    tar
    util-linux
    unzip
    wget
    which
    xz
    zlib-devel
)
